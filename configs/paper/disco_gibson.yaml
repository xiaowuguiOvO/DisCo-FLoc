project_name: disco_model
run_name: disco_gibson_paper
use_wandb: true
gpu_ids: [0]
epochs: 20
batch_size: 64
num_workers: 4
image_log_freq: 1000
encoder_type: dptv2
decoder_type: rrp

dptv2_ckpt_path: checkpoints/depth_anything_v2_vits.pth
image_encoder: vits
freeze_image_backbone: true
feature_dim: 128
num_heads: 4
image_token_grid: [6, 40]
image_self_attn_layers: 1
pairwise_chunk_size: 16
lr: 1.0e-4
lr_scheduler: cosine
min_lr: 1.0e-5

datasets:
  dataset_type: gibson
  map_res: 0.01
  data_folder: datasets_gibson/gibson_f
  data_splits: datasets_gibson/gibson_f/split.yaml
  val_split: test
  floorplan_img_size: [256, 256]
  local_map_crop_size_meters: 5.0
  pose_aug:
    enable: true
    trans_range: 25
    rot_range: 0.26
